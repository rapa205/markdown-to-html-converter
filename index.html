<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Markdown to HTML Converter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
    textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 10px; font-family: monospace; }
    button { padding: 10px 20px; background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .output { background: white; padding: 15px; border: 1px solid #ddd; margin-top: 15px; min-height: 100px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Markdown to HTML Converter</h2>
  <p>Paste your Markdown text below:</p>
  <textarea id="markdownInput" placeholder="# Hello World..."></textarea>
  <br>
  <button onclick="convert()">Convert to HTML</button>
  
  <div class="output" id="htmlOutput"></div>

  <script src="script.js"></script>
</body>
</html>
